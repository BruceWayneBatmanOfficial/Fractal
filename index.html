<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack Club Fractal Explorer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #0070f3, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .controls {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            max-width: 900px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 180px;
        }
        label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #aaa;
        }
        select, input[type="number"] {
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus, input[type="number"]:focus {
            border-color: #0070f3;
        }
        .custom-inputs {
            display: none;
            gap: 1rem;
        }
        .custom-inputs.visible {
            display: flex;
        }
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-width: 200px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        input[type="range"] {
            flex: 1;
            accent-color: #0070f3;
        }
        .slider-value {
            min-width: 2.5rem;
            text-align: center;
            font-weight: 600;
            color: #0070f3;
        }
        button {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #0070f3, #0051a2);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-bottom: 2rem;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 112, 243, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .canvas-container {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            background: #000;
        }
        canvas {
            display: block;
        }
        .caption {
            margin-top: 1rem;
            color: #888;
            font-size: 0.85rem;
        }
        .loading {
            display: none;
            color: #0070f3;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .loading.visible {
            display: block;
        }
    </style>
</head>
<body>
    <h1>🌌 Hack Club Fractal Explorer</h1>
    <p class="subtitle">Adjust parameters to dynamically compile the Julia Fractal formula.</p>

    <div class="controls">
        <div class="control-group">
            <label for="preset">Shape Preset</label>
            <select id="preset">
                <option value="sea-horse">Sea Horse</option>
                <option value="sieving-galaxies">Sieving Galaxies</option>
                <option value="classic-dendrite">Classic Dendrite</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <div class="control-group">
            <label for="colorTheme">Color Profile</label>
            <select id="colorTheme">
                <option value="cosmic-neon">Cosmic Neon</option>
                <option value="solar-flare">Solar Flare</option>
                <option value="monochrome">Monochrome</option>
            </select>
        </div>

        <div class="slider-group">
            <label>Detail Depth: <span id="iterValue">200</span></label>
            <div class="slider-container">
                <input type="range" id="maxIterations" min="50" max="300" value="200" step="10">
            </div>
        </div>
    </div>

    <div class="controls custom-inputs" id="customInputs">
        <div class="control-group">
            <label for="realVal">Real Component (Cr)</label>
            <input type="number" id="realVal" value="-0.74543" step="0.01">
        </div>
        <div class="control-group">
            <label for="imagVal">Imaginary Component (Ci)</label>
            <input type="number" id="imagVal" value="0.11301" step="0.01">
        </div>
    </div>

    <button id="generateBtn">Generate Matrix Grid</button>
    <div class="loading" id="loading">Calculating mathematical infinity plane...</div>

    <div class="canvas-container">
        <canvas id="fractalCanvas" width="600" height="450"></canvas>
    </div>
    <p class="caption" id="caption">Julia Set Matrix: Z^2 + (-0.74543 + 0.11301i)</p>

    <script>
        const canvas = document.getElementById('fractalCanvas');
        const ctx = canvas.getContext('2d');
        const presetSelect = document.getElementById('preset');
        const colorThemeSelect = document.getElementById('colorTheme');
        const maxIterationsSlider = document.getElementById('maxIterations');
        const iterValue = document.getElementById('iterValue');
        const customInputs = document.getElementById('customInputs');
        const realValInput = document.getElementById('realVal');
        const imagValInput = document.getElementById('imagVal');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const caption = document.getElementById('caption');

        const presets = {
            'sea-horse': { real: -0.74543, imag: 0.11301 },
            'sieving-galaxies': { real: 0.28, imag: 0.008 },
            'classic-dendrite': { real: -0.4, imag: 0.6 }
        };

        // Toggle custom inputs visibility
        presetSelect.addEventListener('change', () => {
            if (presetSelect.value === 'custom') {
                customInputs.classList.add('visible');
            } else {
                customInputs.classList.remove('visible');
            }
        });

        // Update slider value display
        maxIterationsSlider.addEventListener('input', () => {
            iterValue.textContent = maxIterationsSlider.value;
        });

        function getColor(count, maxIter, theme) {
            if (count === maxIter) return [0, 0, 0];

            if (theme === 'cosmic-neon') {
                return [
                    Math.floor((count * 5) % 256),
                    Math.floor((count * 2) % 256),
                    150
                ];
            } else if (theme === 'solar-flare') {
                return [
                    240,
                    Math.floor((count * 7) % 256),
                    Math.floor((count * 2) % 256)
                ];
            } else { // monochrome
                const gray = Math.floor((count * 255 / maxIter) % 256);
                return [gray, gray, gray];
            }
        }

        function generateFractal() {
            generateBtn.disabled = true;
            loading.classList.add('visible');

            // Use setTimeout to allow UI to update before heavy computation
            setTimeout(() => {
                const width = canvas.width;
                const height = canvas.height;
                const maxIter = parseInt(maxIterationsSlider.value);
                const theme = colorThemeSelect.value;

                let cReal, cImag;
                if (presetSelect.value === 'custom') {
                    cReal = parseFloat(realValInput.value) || 0;
                    cImag = parseFloat(imagValInput.value) || 0;
                } else {
                    const preset = presets[presetSelect.value];
                    cReal = preset.real;
                    cImag = preset.imag;
                }

                const imageData = ctx.createImageData(width, height);
                const data = imageData.data;

                for (let i = 0; i < width; i++) {
                    for (let y = 0; y < height; y++) {
                        let zi = (i / width) * 3 - 1.5;
                        let zy = (y / height) * 2 - 1.0;

                        let count = 0;
                        while (zi * zi + zy * zy < 4 && count < maxIter) {
                            const temp = zi * zi - zy * zy + cReal;
                            zy = 2 * zi * zy + cImag;
                            zi = temp;
                            count++;
                        }

                        const [r, g, b] = getColor(count, maxIter, theme);
                        const idx = (i + y * width) * 4;
                        data[idx] = r;
                        data[idx + 1] = g;
                        data[idx + 2] = b;
                        data[idx + 3] = 255;
                    }
                }

                ctx.putImageData(imageData, 0, 0);
                caption.textContent = `Julia Set Matrix: Z^2 + (${cReal} + ${cImag}i)`;

                generateBtn.disabled = false;
                loading.classList.remove('visible');
            }, 50);
        }

        generateBtn.addEventListener('click', generateFractal);

        // Generate initial fractal on page load
        generateFractal();
    </script>


</body></html>
